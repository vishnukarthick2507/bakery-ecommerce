name: CI — S.V. Sweets & Bakers

on:
  push:
    branches: [main, temp-ci-diag-cf7b779]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cf7b779e22c0842d1ecc9e4a5430312c32188d18

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Diagnostics (temporary)
        shell: bash
        run: |
          set -euxo pipefail
          echo "---EVENT---"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "---CONTEXT---"
          pwd
          git rev-parse HEAD
          git branch --show-current || true
          echo "---VERSIONS---"
          node --version
          pnpm --version
          echo "---PACKAGE_MANAGER---"
          node -e "const p=require('./package.json'); console.log(p.packageManager || '')"
          echo "---LOCKFILE_META---"
          ls -la pnpm-lock.yaml
          (grep -n '^lockfileVersion:' pnpm-lock.yaml || true) | head -n 5
          (grep -n 'packageManagerDependencies' pnpm-lock.yaml || true) | head -n 20
          awk 'NR<=120 {print NR ":" $0}' pnpm-lock.yaml
          echo "---LOCKFILE_COUNTS---"
          node -e "const fs=require('fs'); const s=fs.readFileSync('pnpm-lock.yaml','utf8'); console.log('lockfileVersion_count=', (s.match(/^lockfileVersion:/gm)||[]).length); console.log('importers_count=', (s.match(/^importers:/gm)||[]).length); console.log('starts_with_doc=', s.startsWith('---'));"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          if [ $code -ne 0 ]; then
            echo "---POST_FAIL_DIFF---"
            git diff --name-only || true
            git diff --stat || true
          fi
          exit $code

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: .

      - name: Backend typecheck
        run: npx tsc --noEmit
        working-directory: ./backend

  backend-tests:
    name: Backend unit & integration tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cf7b779e22c0842d1ecc9e4a5430312c32188d18

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Diagnostics (temporary)
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          pwd
          git rev-parse HEAD
          node --version
          pnpm --version
          node -e "const p=require('./package.json'); console.log(p.packageManager || '')"
          (grep -n '^lockfileVersion:' pnpm-lock.yaml || true) | head -n 2
          (grep -n 'packageManagerDependencies' pnpm-lock.yaml || true) | head -n 10

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          exit $code

      - name: Run backend tests
        run: npx vitest run
        working-directory: ./backend
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
          NODE_ENV: test

  playwright-e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cf7b779e22c0842d1ecc9e4a5430312c32188d18

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Diagnostics (temporary)
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          pwd
          git rev-parse HEAD
          node --version
          pnpm --version
          node -e "const p=require('./package.json'); console.log(p.packageManager || '')"
          (grep -n '^lockfileVersion:' pnpm-lock.yaml || true) | head -n 2
          (grep -n 'packageManagerDependencies' pnpm-lock.yaml || true) | head -n 10

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          exit $code

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.ci.config.ts
        env:
          NODE_ENV: test
