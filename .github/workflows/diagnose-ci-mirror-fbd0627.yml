name: Diagnose CI mirror (fbd0627)

on:
  push:
    branches: [diag/pnpm-lockfile-fbd0627]
  workflow_dispatch:

concurrency:
  group: diag-ci-mirror-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fbd06273d10bfb3d802f7e2641b50070edc9c8d8

      - name: Diagnostic context
        shell: bash
        run: |
          set -euxo pipefail
          echo "---REF---"; git rev-parse HEAD
          echo "---PACKAGE_MANAGER---"; node -e "const p=require('./package.json'); console.log(p.packageManager||'')"
          echo "---LOCK_META---"; awk 'NR<=60 {print NR ":" $0}' pnpm-lock.yaml
          echo "---LOCK_COUNTS---"; node -e "const fs=require('fs');const s=fs.readFileSync('pnpm-lock.yaml','utf8');console.log((s.match(/^lockfileVersion:/gm)||[]).length,(s.match(/^importers:/gm)||[]).length,s.startsWith('---'));"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --version
          node --version
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          if [ $code -ne 0 ]; then
            echo "---LOCKFILE_HEAD---"; awk 'NR<=120 {print NR ":" $0}' pnpm-lock.yaml
            echo "---GIT_DIFF---"; git diff --name-only || true; git diff --stat || true
          fi
          exit $code

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: .

      - name: Backend typecheck
        run: npx tsc --noEmit
        working-directory: ./backend

  backend-tests:
    name: Backend unit & integration tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fbd06273d10bfb3d802f7e2641b50070edc9c8d8

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --version; node --version
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          if [ $code -ne 0 ]; then awk 'NR<=120 {print NR ":" $0}' pnpm-lock.yaml; git diff --stat || true; fi
          exit $code

      - name: Run backend tests
        run: npx vitest run
        working-directory: ./backend
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
          NODE_ENV: test

  playwright-e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fbd06273d10bfb3d802f7e2641b50070edc9c8d8

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --version; node --version
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          echo "---INSTALL_EXIT:$code---"
          if [ $code -ne 0 ]; then awk 'NR<=120 {print NR ":" $0}' pnpm-lock.yaml; git diff --stat || true; fi
          exit $code

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.ci.config.ts
        env:
          NODE_ENV: test
